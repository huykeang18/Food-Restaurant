<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
    <link rel="stylesheet" href="styles.css">
    <title>FoodMan</title>
</head>
<body>
    <nav>
        <div class="nav">
            <div class="nav_header">
                <div class="logo nav_logo">
                <a href="#">Food <span>man</span></a>
            </div>
            <div class="nav_menu_btn" id="menu_btn">
                <span><i class="fa-solid fa-bars"></i></span>
            </div>
        </div>
        <ul class="nav_links" id="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Special</a></li>
            <li><a href="#">Cheif</a></li>
            <li><a href="#">Client</a></li>
            <li><a href="#">Contact Us</a></li>
        </ul>
        <div class="nav_btn">
            <button class="btn"><i class="fa-solid fa-bag-shopping"></i></button>
        </div>
    </nav>
    <section class="section_container header_container" id="id">
        <div class="header_image">
            <img src="assets/header.png" alt="header image">
        </div>
        <div class="header_content">
            <h1>Meet, Eat & Enjoy The <span>True Taste</span></h1>
            <p class="section_description">
                Discover the true essence of culinary delight as you meet, eat, and 
                savor the authentic flavors that define our passion for food.
            </p>
            <div class="header_btn">
                <button class="btn">Get Started</button>
            </div>
        </div>
    </section>
</body>
</html>
